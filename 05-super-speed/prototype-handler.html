<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rook Dispatch console – Handler prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1c2430; --mute:#6b7685; --line:#e1e5eb; --bg:#f4f6f9; --brand:#1f3a5f;
          --taken:#2f7d4f; --missed:#d9822b; --down:#8a93a3; --warn:#b4351f; --warnbg:#fdecea; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:16px; letter-spacing:.3px; }
  header span { opacity:.8; font-size:13px; }
  .banner { background:#fff8e1; border-bottom:1px solid #f0e2a8; padding:6px 20px; font-size:12px; color:#6b5a14; }
  main { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px 20px; max-width:1100px; margin:auto; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:8px; }
  .panel h2 { margin:0; padding:12px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--mute); border-bottom:1px solid var(--line); }
  .resp { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:12px 14px; cursor:pointer; font:inherit; color:inherit; }
  .resp:hover { background:#f7f9fc; }
  .resp.sel { background:#eaf0f8; box-shadow:inset 3px 0 var(--brand); }
  .resp .name { font-weight:600; font-size:15px; }
  .resp .sub { color:var(--mute); font-size:12px; margin-top:2px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-left:6px; vertical-align:1px; }
  .tag.flag { background:var(--warnbg); color:var(--warn); }
  .tag.ok { background:#e6f3ea; color:var(--taken); }
  .detail { padding:16px 18px; }
  .detail h1 { margin:0 0 2px; font-size:20px; }
  .meta { color:var(--mute); font-size:12px; margin-bottom:14px; }
  .flagbox { background:var(--warnbg); border:1px solid #f1b9b0; border-radius:8px; padding:12px 14px; margin-bottom:16px; }
  .flagbox strong { color:var(--warn); }
  .flagbox p { margin:4px 0 8px; }
  .btn { font:inherit; border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--brand); }
  .btn:hover { opacity:.9; }
  .help { margin-top:10px; padding:10px 12px; background:#fff; border:1px solid #f1b9b0; border-radius:6px; display:none; }
  .help.open { display:block; }
  .help pre { background:#f4f6f9; padding:8px; border-radius:6px; white-space:pre-wrap; font:12px/1.4 ui-monospace,Menlo,monospace; margin:6px 0; }
  .tabs { display:flex; gap:6px; margin:0 0 10px; }
  .tabs button { font:inherit; padding:5px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { font-size:12px; color:var(--mute); font-weight:600; }
  tr.low td { background:#fff6f4; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:200px; padding:10px 4px 0; border-bottom:1px solid var(--line); }
  .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .col .stack { width:70%; display:flex; flex-direction:column-reverse; }
  .col .seg { width:100%; }
  .col .n { font-size:11px; color:var(--mute); margin-bottom:2px; }
  .labels { display:flex; gap:10px; padding:4px; font-size:11px; color:var(--mute); }
  .labels div { flex:1; text-align:center; }
  .legend { display:flex; gap:14px; font-size:12px; margin-top:8px; color:var(--mute); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
  .note { font-size:12px; color:var(--mute); margin-top:10px; }
  .cmp { margin-top:14px; }
</style>
</head>
<body>
<header><b>Rook Dispatch · Console</b><span>Signed in as Kip (handler)</span></header>
<div class="banner">Prototype for review. Weekly counts are real figures from the pings table (weeks starting 13 Jul – 31 Aug 2026). The flag, report and Support wording are proposed, not built.</div>
<main>
  <section class="panel">
    <h2>Your responders</h2>
    <div id="list"></div>
  </section>
  <section class="panel detail" id="detail"></section>
</main>

<script>
const weeks = ["13 Jul","20 Jul","27 Jul","3 Aug","10 Aug","17 Aug","24 Aug","31 Aug"];
// [pings, taken, missed, turned down] — from the pings table
const data = {
  "Meteor Mite": { area:"Eastgate", rows:[[10,6,0,4],[11,7,1,3],[12,9,1,2],[11,8,0,3],[10,4,4,2],[4,1,2,1],[2,0,1,1],[1,0,1,0]] },
  "The Gale":    { area:"Eastgate", rows:[[13,10,0,3],[14,11,1,2],[13,11,1,1],[13,10,0,3],[15,9,3,3],[17,12,2,3],[20,14,2,4],[21,16,2,3]] }
};
const THRESHOLD = 0.5;
function usual(r){ const a=r.slice(0,4); return a.reduce((s,x)=>s+x[0],0)/4; }
function isFlagged(name){ const r=data[name].rows; return r[7][0] < THRESHOLD*usual(r); }

let current = "Meteor Mite", view = "table";

function renderList(){
  document.getElementById("list").innerHTML = Object.keys(data).map(n=>{
    const r=data[n].rows, f=isFlagged(n);
    return `<button class="resp ${n===current?'sel':''}" data-n="${n}">
      <div class="name">${n}${f?'<span class="tag flag">Receiving fewer pings</span>':'<span class="tag ok">Normal</span>'}</div>
      <div class="sub">${data[n].area} · ${r[7][0]} pings in latest week</div></button>`;
  }).join("");
  document.querySelectorAll(".resp").forEach(b=>b.onclick=()=>{ current=b.dataset.n; render(); });
}

function flagHTML(n){
  const r=data[n].rows, u=+usual(r).toFixed(1);
  return `<div class="flagbox">
    <strong>Receiving fewer pings</strong>
    <p>${n} had <b>${r[7][0]}</b> ${r[7][0]===1?'ping':'pings'} in the latest week, against a usual <b>${u}</b> a week
    (the average of the four weeks from 13 Jul). That is below the ${Math.round(THRESHOLD*100)}% flag level. The drop began in the week of 10 Aug.</p>
    <button class="btn" id="helpBtn">What can I do?</button>
    <div class="help" id="help">
      <b>Contact Rook Support</b> if you want this looked at. They can check the case and decide what to do, including a score reset.
      <pre id="summary">Responder: ${n} (${data[n].area}), handler Kip
Latest week: ${r[7][0]} pings vs usual ${u}
Weeks 10 Aug to 31 Aug: pings ${r.slice(4).map(x=>x[0]).join(", ")}; missed ${r.slice(4).map(x=>x[2]).join(", ")}
Last callout taken: week of 17 Aug</pre>
      <button class="btn ghost" id="copyBtn">Copy this summary for Support</button>
      <span id="copied" style="margin-left:8px;color:var(--taken);display:none">Copied</span>
    </div></div>`;
}

function reportHTML(n){
  const r=data[n].rows, u=usual(r);
  if (view==="table") {
    return `<table><tr><th>Week starting</th><th>Pings received</th><th>Taken</th><th>Missed</th><th>Turned down</th></tr>`+
      r.map((x,i)=>`<tr class="${x[0]<THRESHOLD*u?'low':''}"><td>${weeks[i]}</td><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join("")+`</table>`;
  }
  const max=Math.max(...Object.values(data).flatMap(d=>d.rows.map(x=>x[0])));
  const h=170;
  return `<div class="chart">`+r.map(x=>`<div class="col"><div class="n">${x[0]}</div><div class="stack">
      <div class="seg" style="height:${x[1]/max*h}px;background:var(--taken)" title="Taken ${x[1]}"></div>
      <div class="seg" style="height:${x[2]/max*h}px;background:var(--missed)" title="Missed ${x[2]}"></div>
      <div class="seg" style="height:${x[3]/max*h}px;background:var(--down)" title="Turned down ${x[3]}"></div></div></div>`).join("")+`</div>
    <div class="labels">${weeks.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--taken)"></i>Taken</span><span><i style="background:var(--missed)"></i>Missed</span><span><i style="background:var(--down)"></i>Turned down</span></div>`;
}

function render(){
  renderList();
  const n=current;
  document.getElementById("detail").innerHTML = `
    <h1>${n}</h1><div class="meta">${data[n].area} · Weekly ping report, last 8 weeks</div>
    ${isFlagged(n)?flagHTML(n):''}
    <div class="tabs"><button data-v="table" class="${view==='table'?'on':''}">Table</button><button data-v="chart" class="${view==='chart'?'on':''}">Chart</button></div>
    ${reportHTML(n)}
    <div class="note">Shaded rows are weeks below ${Math.round(THRESHOLD*100)}% of the responder's usual. Counts only, and no personal details.
    ${n==="Meteor Mite"?'Compare with <a href="#" id="cmpLink">The Gale</a>, who shares Eastgate and your console.':'Compare with <a href="#" id="cmpLink">Meteor Mite</a>, who shares Eastgate and your console.'}</div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ view=b.dataset.v; render(); });
  const hb=document.getElementById("helpBtn");
  if(hb){ hb.onclick=()=>document.getElementById("help").classList.toggle("open");
    document.getElementById("copyBtn").onclick=()=>{
      const t=document.getElementById("summary").textContent;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{}).finally(()=>{ document.getElementById("copied").style.display="inline"; });
    }; }
  document.getElementById("cmpLink").onclick=e=>{ e.preventDefault(); current = n==="Meteor Mite"?"The Gale":"Meteor Mite"; render(); };
}
render();
</script>
</body>
</html>
